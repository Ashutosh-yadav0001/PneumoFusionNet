[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pneumofusionnet"
version = "1.0.0"
description = "Explainable multimodal deep learning for pneumonia detection from MIMIC-CXR"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ashutosh Yadav", email = "ashutosh@op.iitg.ac.in" }
]
keywords = [
    "medical imaging", "pneumonia detection", "multimodal learning",
    "chest x-ray", "MIMIC-CXR", "Bio_ClinicalBERT", "DenseNet",
    "cross-attention", "deep learning", "explainable AI"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "Pillow>=9.5",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "opencv-python>=4.8",
    "albumentations>=1.3",
    "tqdm>=4.66",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "beautifulsoup4>=4.12",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[project.urls]
Homepage   = "https://github.com/Ashutosh-yadav0001/PneumoFusionNet"
Repository = "https://github.com/Ashutosh-yadav0001/PneumoFusionNet"
Issues     = "https://github.com/Ashutosh-yadav0001/PneumoFusionNet/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
